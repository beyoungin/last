<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aplikasi Chat</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; }
    body { background-color: #0b0f19; color: #e2e8f0; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 1rem; }
    
    .chat-card { background: #151d2a; border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 16px; width: 100%; max-width: 480px; height: 88vh; display: flex; flex-direction: column; overflow: hidden; position: relative; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
    
    /* MODAL LOGIN */
    .auth-modal { position: absolute; inset: 0; background: #151d2a; z-index: 30; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 2rem; text-align: center; }
    .auth-form { width: 100%; display: flex; flex-direction: column; gap: 0.8rem; }
    .auth-form input { width: 100%; padding: 0.8rem; background: #0b0f19; border: 1px solid #334155; border-radius: 8px; color: #f8fafc; font-size: 0.9rem; outline: none; }
    .auth-form button { width: 100%; padding: 0.8rem; background: #38bdf8; color: #0b0f19; font-weight: 700; border: none; border-radius: 8px; cursor: pointer; transition: 0.2s; }
    
    /* LOADING OVERLAY (DINO JUMPING) - DEFAULT HIDDEN (DISPLAY: NONE) */
    .loading-overlay { position: absolute; inset: 0; background: rgba(21, 29, 42, 0.95); z-index: 40; display: none; flex-direction: column; justify-content: center; align-items: center; gap: 0.8rem; }
    .dino-loading-gif { width: 90px; height: 90px; object-fit: contain; }
    .loading-text { font-size: 0.85rem; color: #38bdf8; font-weight: 600; }

    /* HEADER UI */
    .chat-header { background: rgba(0, 0, 0, 0.3); padding: 0.8rem 1rem; border-bottom: 1px solid rgba(255, 255, 255, 0.05); display: flex; justify-content: space-between; align-items: center; }
    .chat-header-info h2 { font-size: 1rem; color: #f8fafc; }
    .logout-btn { background: rgba(244, 63, 94, 0.15); border: 1px solid rgba(244, 63, 94, 0.3); color: #fb7185; padding: 0.3rem 0.6rem; border-radius: 6px; font-size: 0.7rem; cursor: pointer; }

    /* CHAT MESSAGES */
    .chat-messages { flex: 1; padding: 1rem; overflow-y: auto; display: flex; flex-direction: column; gap: 0.8rem; }
    .msg-group { display: flex; flex-direction: column; max-width: 85%; }
    .msg-bubble { padding: 0.65rem 0.9rem; border-radius: 12px; font-size: 0.88rem; background: #0f766e; color: #f0fdf4; line-height: 1.4; }

    /* PILIHAN INTERAKTIF */
    .options-section { padding: 0.8rem; background: rgba(15, 23, 42, 0.6); border-top: 1px solid rgba(255, 255, 255, 0.05); display: flex; flex-direction: column; gap: 0.5rem; }
    .options-title { font-size: 0.8rem; font-weight: 700; color: #38bdf8; }
    .options-grid { display: flex; gap: 0.5rem; flex-wrap: wrap; }
    .opt-btn { flex: 1; min-width: 45%; padding: 0.6rem; background: #1e293b; border: 1px solid #334155; border-radius: 8px; color: #f8fafc; font-size: 0.82rem; cursor: pointer; font-weight: 600; text-align: center; }
    .opt-btn:disabled { opacity: 0.5; cursor: not-allowed; }

    /* PANEL BUAT PILIHAN */
    .admin-panel { padding: 0.8rem; background: #0f172a; border-top: 1px solid rgba(255, 255, 255, 0.1); display: none; flex-direction: column; gap: 0.5rem; }
    .admin-panel input { padding: 0.5rem; background: #0b0f19; border: 1px solid #334155; border-radius: 6px; color: #fff; font-size: 0.8rem; }
    
    /* INPUT CHAT FORM */
    .chat-input { padding: 0.6rem 0.8rem; background: rgba(0, 0, 0, 0.3); border-top: 1px solid rgba(255, 255, 255, 0.05); display: flex; gap: 0.3rem; }
    .chat-input input { flex: 1; padding: 0.65rem; background: #0b0f19; border: 1px solid #334155; border-radius: 8px; color: #f8fafc; font-size: 0.88rem; outline: none; }
    .chat-input button { background: #38bdf8; color: #0b0f19; border: none; padding: 0.65rem 0.9rem; border-radius: 8px; font-weight: 700; cursor: pointer; }
    .chat-input input:disabled, .chat-input button:disabled { opacity: 0.4; cursor: not-allowed; }
  </style>
</head>
<body>

  <div class="chat-card">
    
    <!-- ANIMASI LOADING DINOSAURUS (HANYA AKTIF SAAT PROSES LOGIN) -->
    <div class="loading-overlay" id="loading-overlay">
      <img src="https://media.giphy.com/media/26u49e6Z8Oplz4Rtm/giphy.gif" alt="Dino Loading" class="dino-loading-gif">
      <div class="loading-text">Menyiapkan obrolan...</div>
    </div>

    <!-- POPUP LOGIN -->
    <div class="auth-modal" id="auth-modal">
      <form class="auth-form" id="login-form">
        <h3 style="color:#f8fafc; margin-bottom:0.3rem;">Masuk Akun</h3>
        <p style="font-size:0.75rem; color:#94a3b8; margin-bottom:1rem;">Silakan masuk untuk melanjutkan</p>
        <input type="email" id="auth-email" placeholder="Email" required autocomplete="username">
        <input type="password" id="auth-password" placeholder="Kata Sandi" required autocomplete="current-password">
        <button type="submit">Masuk</button>
      </form>
    </div>

    <!-- HEADER -->
    <div class="chat-header">
      <div class="chat-header-info">
        <h2>Ruang Obrolan</h2>
      </div>
      <button class="logout-btn" id="logout-btn">Keluar</button>
    </div>
    
    <!-- AREA CHAT -->
    <div class="chat-messages" id="messages-container"></div>

    <!-- AREA PILIHAN -->
    <div class="options-section" id="options-section">
      <div class="options-title">Pilihan yang tersedia:</div>
      <div class="options-grid" id="options-grid"></div>
    </div>

    <!-- PANEL BUAT PILIHAN -->
    <div class="admin-panel" id="admin-panel">
      <span style="font-size:0.75rem; color:#94a3b8; font-weight:700;">Buat Pilihan Baru</span>
      <div style="display:flex; gap:0.4rem;">
        <input type="text" id="new-opt-1" placeholder="Opsi A">
        <input type="text" id="new-opt-2" placeholder="Opsi B">
        <button id="save-options-btn" style="padding:0.5rem; background:#38bdf8; border:none; border-radius:6px; font-weight:700; cursor:pointer;">Simpan</button>
      </div>
    </div>

    <!-- INPUT CHAT -->
    <div class="chat-input">
      <input type="text" id="message-input" placeholder="Ketik pesan..." autocomplete="off">
      <button id="send-btn">Kirim</button>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { getDatabase, ref, push, set, onValue, onChildAdded } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    // GANTI DENGAN KODE CONFIG ASLI DARI FIREBASE CONSOLE
    const firebaseConfig = {
      apiKey: "AIzaSyBBBXwONde-J0tpoHxBxDly0l9kAKdT8I",
      authDomain: "chitt-chatt-d8fbe.firebaseapp.com",
      databaseURL: "https://chitt-chatt-d8fbe-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "chitt-chatt-d8fbe",
      storageBucket: "chitt-chatt-d8fbe.appspot.com",
      messagingSenderId: "PASTE_SENDER_ID_ASLI_KAMU",
      appId: "PASTE_APP_ID_ASLI_KAMU"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getDatabase(app);

    const ADMIN_EMAIL = "mudrikawahbi@gmail.com";
    const VISITOR_EMAIL = "natahilda082@gmail.com";
    const ALLOWED_EMAILS = [ADMIN_EMAIL.toLowerCase(), VISITOR_EMAIL.toLowerCase()];

    const loadingOverlay = document.getElementById('loading-overlay');
    const authModal = document.getElementById('auth-modal');
    const loginForm = document.getElementById('login-form');
    const authEmail = document.getElementById('auth-email');
    const authPassword = document.getElementById('auth-password');
    const logoutBtn = document.getElementById('logout-btn');
    
    const msgContainer = document.getElementById('messages-container');
    const msgInput = document.getElementById('message-input');
    const sendBtn = document.getElementById('send-btn');
    
    const adminPanel = document.getElementById('admin-panel');
    const optionsGrid = document.getElementById('options-grid');
    const saveOptionsBtn = document.getElementById('save-options-btn');

    // LOGIKA TOMBOL MASUK (LOADING DINO DITAMPILKAN DI SINI)
    loginForm.addEventListener('submit', (e) => {
      e.preventDefault();
      const email = authEmail.value.trim().toLowerCase();
      const password = authPassword.value.trim();

      if (!ALLOWED_EMAILS.includes(email)) {
        alert("Akses Ditolak: Email tidak terdaftar.");
        return;
      }

      // TAMPILKAN DINO JUMPING LOADING HANYA SAAT TOMBOL MASUK DIKLIK
      loadingOverlay.style.display = 'flex';
      
      signInWithEmailAndPassword(auth, email, password)
        .catch((error) => {
          // JIKA GAGAL, SEMBUNYIKAN LOADING DINO
          loadingOverlay.style.display = 'none';
          alert("Gagal Masuk: Kata sandi atau email salah.");
        });
    });

    logoutBtn.addEventListener('click', () => {
      signOut(auth);
    });

    // PEMERIKSAAN PERAN USER & PERPINDAHAN LAYAR
    onAuthStateChanged(auth, (user) => {
      if (user) {
        const userEmail = user.email.toLowerCase();

        if (!ALLOWED_EMAILS.includes(userEmail)) {
          alert("Akses Ditolak!");
          signOut(auth);
          return;
        }

        authModal.style.display = 'none';

        if (userEmail === ADMIN_EMAIL.toLowerCase()) {
          msgInput.disabled = false;
          sendBtn.disabled = false;
          msgInput.placeholder = "Ketik pesan...";
          adminPanel.style.display = 'flex';
          loadOptions(user, true);
        } else if (userEmail === VISITOR_EMAIL.toLowerCase()) {
          msgInput.disabled = true;
          sendBtn.disabled = true;
          msgInput.placeholder = "Anda tidak bisa mengirim pesan.";
          adminPanel.style.display = 'none';
          loadOptions(user, false);

          // CATAT KAPAN HILDA MASUK
          const now = new Date();
          const jamMasuk = now.toLocaleString('id-ID', { 
            dateStyle: 'full', 
            timeStyle: 'medium' 
          });

          push(ref(db, 'user_logs/hilda'), {
            email: userEmail,
            waktuMasuk: jamMasuk,
            timestamp: Date.now()
          });
        }

        // SEMBUNYIKAN LOADING DINO SETELAH BERHASIL MASUK KE RUANG CHAT
        setTimeout(() => {
          loadingOverlay.style.display = 'none';
        }, 1000);

      } else {
        authModal.style.display = 'flex';
        loadingOverlay.style.display = 'none';
      }
    });

    // KIRIM CHAT
    sendBtn.addEventListener('click', () => {
      const text = msgInput.value.trim();
      if (text !== "") {
        push(ref(db, 'messages'), {
          text: text,
          timestamp: Date.now()
        });
        msgInput.value = "";
      }
    });

    // TAMPILKAN CHAT
    onChildAdded(ref(db, 'messages'), (snapshot) => {
      const data = snapshot.val();
      const div = document.createElement('div');
      div.className = 'msg-group';
      div.innerHTML = `<div class="msg-bubble">${data.text}</div>`;
      msgContainer.appendChild(div);
      msgContainer.scrollTop = msgContainer.scrollHeight;
    });

    // SIMPAN PILIHAN BARU
    saveOptionsBtn.addEventListener('click', () => {
      const opt1 = document.getElementById('new-opt-1').value.trim();
      const opt2 = document.getElementById('new-opt-2').value.trim();

      if (opt1 && opt2) {
        set(ref(db, 'options'), {
          choices: [opt1, opt2]
        });
        document.getElementById('new-opt-1').value = "";
        document.getElementById('new-opt-2').value = "";
      }
    });

    // MUAT PILIHAN INTERAKTIF
    function loadOptions(user, isAdmin) {
      onValue(ref(db, 'options'), (snapshot) => {
        optionsGrid.innerHTML = "";
        const data = snapshot.val();

        if (data && data.choices) {
          data.choices.forEach((choiceText) => {
            const btn = document.createElement('button');
            btn.className = 'opt-btn';
            btn.innerText = choiceText;

            if (isAdmin) {
              btn.disabled = true;
            } else {
              btn.addEventListener('click', () => {
                set(ref(db, `responses/${user.uid}`), {
                  email: user.email,
                  selectedChoice: choiceText,
                  timestamp: Date.now()
                });
                alert(`Pilihan (${choiceText}) berhasil terkirim!`);
              });
            }

            optionsGrid.appendChild(btn);
          });
        }
      });
    }
  </script>
</body>
</html>
